name: DevSecOps-K8s-Multi-Container-Pipeline

on:
  push:
    branches:
      - main

jobs:
  # --- JOB 1: CI, CODE QUALITY (SONAR), DOUBLE SECURITY SCAN & PUSH ---
  ci-security-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. Core Source Code Scan
      - name: Run Trivy FS (Code) Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      # 2. Setup Runtime Environment for Code Quality
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # 3. Code Quality Analysis (V3 with auto Java bindings)
      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@v3.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=chatapp-monorepo
            -Dsonar.projectName=chatapp-k8s-project
            -Dsonar.sources=.
            -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/k8s/**
            -Dsonar.ws.timeout=300
            -Dsonar.scanner.connectTimeout=300000
            -Dsonar.scanner.socketTimeout=300000

      # 4. Registry Authentication
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ==================== FRONTEND PIPELINE ====================
      - name: Build Frontend Docker Image Locally
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          load: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/note-app-frontend:${{ github.sha }}

      - name: Run Trivy Frontend Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKERHUB_USERNAME }}/note-app-frontend:${{ github.sha }}'
          scan-type: 'image'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      - name: Push Frontend Docker Image to Docker Hub
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/note-app-frontend:${{ github.sha }}

      # ==================== BACKEND PIPELINE ====================
      - name: Build Backend Docker Image Locally
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          load: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/note-app-backend:${{ github.sha }}

      - name: Run Trivy Backend Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKERHUB_USERNAME }}/note-app-backend:${{ github.sha }}'
          scan-type: 'image'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      - name: Push Backend Docker Image to Docker Hub
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/note-app-backend:${{ github.sha }}

  # --- JOB 2: CD (Kubernetes Manifests Deployment to Kind via GCP VM) ---
  deploy-to-kind:
    runs-on: ubuntu-latest
    needs: ci-security-and-push
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.JSON_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: SSH and Deploy to Kind Cluster
        run: |
          # 1. Private key setup aur strict public key (.pub) map generate karna
          echo "${{ secrets.KEY }}" > private_key.pem
          chmod 600 private_key.pem
          ssh-keygen -y -f private_key.pem > private_key.pem.pub

          # 2. 🔥 THE FIX: Direct ssh-flag bypass mapping bina kisi unrecognized properties ke
          gcloud compute ssh instance-20260826-152012 \
            --zone="us-central1-a" \
            --quiet \
            --tunnel-through-iap \
            --ssh-key-file="./private_key.pem" \
            --ssh-flag="-o ConnectTimeout=120" \
            --command="
              sudo bash -c '
                cd /home/sandeshsaini7983637650/chatapp-k8s || cd /root/chatapp-k8s || exit 1
                
                git config --global --add safe.directory \"\$(pwd)\"
                git pull origin main
                
                sed -i \"s|image: .*note-app-frontend.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/note-app-frontend:${{ github.sha }}|g\" ./k8s/*.*ml || true
                sed -i \"s|image: .*note-app-backend.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/note-app-backend:${{ github.sha }}|g\" ./k8s/*.*ml || true
                
                kubectl apply -f ./k8s/namespace.yml || kubectl create namespace app --dry-run=client -o yaml | kubectl apply -f -
                sleep 5
                kubectl apply -f ./k8s/
              '
            "

