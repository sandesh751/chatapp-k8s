name: DevSecOps-K8s-Multi-Container-Pipeline

on:
  push:
    branches:
      - main

jobs:
  # --- JOB 1: CI, DOUBLE SECURITY SCAN & PUSH FOR BOTH ---
  ci-security-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Whole Repo Code Scan (Trivy)
      - name: Run Trivy FS (Code) Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      # 2. Docker Hub Login
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ==================== FRONTEND BUILD & SCAN ====================
      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend # <--- Yahan frontend folder ka path aayega
          file: ./frontend/Dockerfile # <--- Frontend ki Dockerfile ka path
          push: false
          load: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/note-app-frontend:${{ github.sha }}

      - name: Run Trivy Frontend Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKERHUB_USERNAME }}/note-app-frontend:${{ github.sha }}'
          scan-type: 'image'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      - name: Push Frontend Docker Image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/note-app-frontend:${{ github.sha }}


      # ==================== BACKEND BUILD & SCAN ====================
      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend # <--- Yahan backend folder ka path aayega
          file: ./backend/Dockerfile # <--- Backend ki Dockerfile ka path
          push: false
          load: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/note-app-backend:${{ github.sha }}

      - name: Run Trivy Backend Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKERHUB_USERNAME }}/note-app-backend:${{ github.sha }}'
          scan-type: 'image'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      - name: Push Backend Docker Image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/note-app-backend:${{ github.sha }}

  # --- JOB 2: CD (Kubernetes Manifests Deployment) ---
  deploy-to-k8s:
    runs-on: ubuntu-latest
    needs: ci-security-and-push
    steps:
      - name: Checkout Manifests
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.JSON_KEY }}

      - name: Get GKE Cluster Credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: instance-20260826-152012
          location: us-central1-a

      # Fixed: Dono manifests (frontend aur backend) ke andar image tags update karna
      - name: Update Image Tags in Manifests & Apply
        run: |
          # Agar alag-alag deployment files hain toh dono me update karenge
          # Maan lete hain files ka naam 'frontend-deployment.yaml' aur 'backend-deployment.yaml' hai
          
          if [ -f frontend-deployment.yaml ]; then
            sed -i "s|image: .*note-app-frontend.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/note-app-frontend:${{ github.sha }}|g" frontend-deployment.yaml
            kubectl apply -f frontend-deployment.yaml
          fi
          
          if [ -f backend-deployment.yaml ]; then
            sed -i "s|image: .*note-app-backend.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/note-app-backend:${{ github.sha }}|g" backend-deployment.yaml
            kubectl apply -f backend-deployment.yaml
          fi
          
          # Agar aapka service.yaml hai toh use bhi apply kar dein
          kubectl apply -f service.yaml --ignore-not-found=true
