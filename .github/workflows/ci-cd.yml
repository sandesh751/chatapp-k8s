name: CI-Security-Pipeline-Only

on:
  push:
    branches:
      - main

jobs:
  # --- STAGE 1: FULL CI & DOUBLE SECURITY SCAN & PUSH ---
  ci-security-and-push:
    runs-on: ubuntu-latest
    steps:
      # Step 1: GitHub se code runner machine par lana
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # SonarQube history tracking ke liye zaroori hai

      # Step 2: [DevSecOps] Pure repository ke core code aur dependencies ka file scan
      - name: Run Trivy FS (Code) Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          exit-code: '0' # Warning dega par pipeline pass ho jayegi
          severity: 'CRITICAL,HIGH'
      # java 21 setup for sonarQube
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      # sonarQubescan
      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@v3.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          # Yeh line container ke andar direct Java 21 path pass kar degi, error nahi aayega
          SONAR_SCANNER_JAVA_EXE: /opt/hostedtoolcache/Java_temurin-beta_bundle/21.0.0/x64/bin/java
        with:
          args: >
            -Dsonar.projectKey=chatapp-monorepo
            -Dsonar.projectName=chatapp-k8s-project
            -Dsonar.sources=.
            -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/k8s/**
            -Dsonar.ws.timeout=300
            -Dsonar.scanner.connectTimeout=300000
            -Dsonar.scanner.socketTimeout=300000

      # Step 3: Docker Hub account se connect/login karna
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ==================== FRONTEND PIPELINE ====================
      
      # Step 4: Frontend ki Docker Image banana (Local runner me load hogi)
      - name: Build Frontend Docker Image Locally
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          load: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/note-app-frontend:latest

      # Step 5: [DevSecOps] Bani hui Frontend Image ke andar ka security scan
      - name: Run Trivy Frontend Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKERHUB_USERNAME }}/note-app-frontend:latest'
          scan-type: 'image'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      # Step 6: Frontend Image ko Docker Hub Registry par final upload/push karna
      - name: Push Frontend Docker Image to Docker Hub
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/note-app-frontend:latest


      # ==================== BACKEND PIPELINE ====================
      
      # Step 7: Backend ki Docker Image banana (Local runner me load hogi)
      - name: Build Backend Docker Image Locally
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          load: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/note-app-backend:latest

      # Step 8: [DevSecOps] Bani hui Backend Image ke andar ka security scan
      - name: Run Trivy Backend Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKERHUB_USERNAME }}/note-app-backend:latest'
          scan-type: 'image'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      # Step 9: Backend Image ko Docker Hub Registry par final upload/push karna
      - name: Push Backend Docker Image to Docker Hub
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/note-app-backend:latest
  # --- JOB 2: CD (Kubernetes Manifests Deployment to Kind via GCP VM) ---
  deploy-to-kind:
    runs-on: ubuntu-latest
    needs: ci-security-and-push # Job 1 pass hone ke baad hi chalega
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.JSON_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
      - name: SSH and Deploy to Kind Cluster
        run: |
          # VM ke system security configurations ko override karne ke liye standard flag mapping
          gcloud compute ssh instance-20260826-152012 \
            --zone="us-central1-a" \
            --quiet \
            --tunnel-through-iap \
            --metadata="block-project-ssh-keys=FALSE" \
            --command="
              sudo bash -c '
                cd /home/sandeshsaini7983637650/chatapp-k8s || cd /root/chatapp-k8s || exit 1
                
                git config --global --add safe.directory \"\$(pwd)\"
                git pull origin main
                
                sed -i \"s|image: .*note-app-frontend.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/note-app-frontend:${{ github.sha }}|g\" ./k8s/*.*ml || true
                sed -i \"s|image: .*note-app-backend.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/note-app-backend:${{ github.sha }}|g\" ./k8s/*.*ml || true
                
                kubectl apply -f ./k8s/namespace.yml || kubectl create namespace app --dry-run=client -o yaml | kubectl apply -f -
                sleep 3
                kubectl apply -f ./k8s/
              '
            "


